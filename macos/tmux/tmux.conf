# tmux — vi-style copy-mode as scrollback fallback for Ghostty
# Reload with: prefix + r

# General
set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g mouse on

# Vi keys everywhere
set -g status-keys vi
setw -g mode-keys vi

# Prefix stays C-b; reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"

# Enter copy-mode with prefix + [ (default), also PageUp
bind -n PageUp copy-mode

# Copy-mode: vim navigation is built in with mode-keys vi.
# Add the vim selection/search/copy layer:
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi / send-keys -X search-forward
bind -T copy-mode-vi ? send-keys -X search-backward
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-again-inverse

# Copy to macOS pasteboard via OSC 52 (Ghostty supports it, no reattach needed)
set -g set-clipboard on