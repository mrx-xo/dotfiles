<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GAIA · Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{--bg:#070B12;--panel:#0D1420;--grid:rgba(120,180,255,.07);--line:rgba(120,180,255,.16);
    --txt:#DCE6F5;--mut:#5C6E8A;--acc:#3EE8FF;--acc2:#B6FF3E;--alert:#FF5470;--glow:0 0 12px rgba(62,232,255,.35)}
  :root[data-theme="light"]{--bg:#FAFBFC;--panel:#FFFFFF;--grid:rgba(10,40,90,.05);--line:rgba(10,40,90,.14);
    --txt:#0C1017;--mut:#68758A;--acc:#0A6CFF;--acc2:#0FA36B;--alert:#E11D48;--glow:none}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);max-width:470px;margin:0 auto;padding:16px 15px 26px;
       font-family:"JetBrains Mono",monospace;
       background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
       background-size:34px 34px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:11px;
       letter-spacing:.12em;color:var(--mut)}
  .bar b{color:var(--acc)}
  .tgl{border:1px solid var(--line);background:var(--panel);color:var(--acc);width:36px;height:36px;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);position:relative;padding:16px;margin-bottom:12px}
  .panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border:1.5px solid var(--acc)}
  .panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .cap{font-size:10px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
  .now .t{font-family:"Fraunces",serif;font-size:34px;font-weight:600;letter-spacing:-.01em;margin:9px 0 3px;line-height:1}
  .now .ep{font-size:12px;color:var(--mut);letter-spacing:.05em}
  .seg{display:flex;gap:3px;margin:16px 0 8px}
  .seg i{flex:1;height:8px;background:var(--line)}
  .seg i.on{background:var(--acc);box-shadow:var(--glow)}
  .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
  .tr{display:flex;gap:8px;margin-top:15px}
  .tr button{flex:1;background:transparent;border:1px solid var(--line);color:var(--txt);padding:13px 0;font-size:17px;font-family:inherit}
  .tr .pl{border-color:var(--acc);color:var(--acc);box-shadow:var(--glow)}
  .srch{display:flex;align-items:center;gap:8px;color:var(--acc2);font-size:15px;letter-spacing:.02em}
  .srch .cur{width:9px;height:17px;background:var(--acc2);display:inline-block;animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
  .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .app{background:var(--panel);border:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;
       align-items:center;gap:8px;position:relative}
  .app .l{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
  .app .n{font-size:10px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
  .split{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
  .vol .num{font-size:44px;font-weight:700;letter-spacing:-.02em;color:var(--acc);text-shadow:var(--glow);line-height:1;margin:6px 0}
  .vol .vr{display:flex;gap:8px;margin-top:8px}
  .vol .vr button{flex:1;background:transparent;border:1px solid var(--line);color:var(--txt);padding:11px 0;font-size:18px;font-family:inherit}
  .pw{display:flex;flex-direction:column;justify-content:space-between}
  .pw .big{font-size:30px;color:var(--acc2);text-align:center;margin:auto 0}
  .pw .go{background:transparent;border:1px solid var(--acc2);color:var(--acc2);padding:12px 0;font-size:12px;letter-spacing:.1em;font-family:inherit}
  .nav{display:flex;justify-content:center;gap:8px;margin-top:22px}
  .nav a{color:var(--mut);text-decoration:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
         padding:8px 13px;border:1px solid var(--line)}
  .nav a.on{color:var(--acc);border-color:var(--acc);box-shadow:var(--glow)}
</style></head><body>
  <div class="bar"><span>GAIA // LIVING_ROOM // <b>ONLINE</b></span><button class="tgl" onclick="tg()">◐</button></div>

  <div class="panel now">
    <div class="cap">▎Now Playing — Netflix</div>
    <div class="t">The Bear</div><div class="ep">S3_E5 · CHILDREN</div>
    <div class="seg"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
    <div class="row"><span>26:41</span><span>RUNTIME 43:01</span><span>−16:20</span></div>
    <div class="tr"><button>⏮</button><button class="pl">⏸ PAUSE</button><button>⏭</button></div>
  </div>

  <div class="panel srch">&gt; SEARCH_ON_TV<span class="cur"></span></div>

  <div class="apps">
    <div class="app"><span class="l" style="background:#E50914">N</span><span class="n">Netflix</span></div>
    <div class="app"><span class="l" style="background:#FF0000">▶</span><span class="n">YouTube</span></div>
    <div class="app"><span class="l" style="background:#8E44EC">V</span><span class="n">ViX</span></div>
    <div class="app"><span class="l" style="background:#1BA5A0">A</span><span class="n">Angel</span></div>
    <div class="app"><span class="l" style="background:#00A4DC">J</span><span class="n">Jellyfin</span></div>
    <div class="app"><span class="l" style="background:#113CCF">D</span><span class="n">Disney+</span></div>
  </div>

  <div class="split">
    <div class="panel vol"><div class="cap">▎Volume</div><div class="num">18</div>
      <div class="vr"><button>−</button><button>+</button><button>⊘</button></div></div>
    <div class="panel pw"><div class="cap">▎Power</div><div class="big">⏻</div><button class="go">POWER OFF</button></div>
  </div>

  <div class="nav"><a href="/m/obsidian">Obsidian</a><a href="/m/signal">Signal</a><a class="on" href="/m/console">Console</a></div>
<script>function tg(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==='light'?'dark':'light';}</script>
</body></html>
